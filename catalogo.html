<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Kolvi Game Store</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --gold:       #C9A84C;
      --gold-light: #F0D080;
      --gold-dark:  #8B6914;
      --black:      #0A0A0A;
      --cream:      #F5EED8;
      --cream-dark: #E8D9B0;
      --ink:        #1A1208;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--cream);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.4;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0; left: 0; right: 0;
      z-index: 500;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(201,168,76,0.12);
    }
    .nav-logo {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem; color: var(--gold);
      text-decoration: none; letter-spacing: 0.05em;
    }
    .nav-back {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600; font-size: 0.8rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(245,238,216,0.5);
      text-decoration: none; transition: color 0.2s;
    }
    .nav-back:hover { color: var(--gold); }
    .nav-back svg { width: 14px; height: 14px; }

    /* ── HEADER DE PÁGINA ── */
    .page-header {
      padding: 3rem 1.5rem 0;
      text-align: center;
      background: linear-gradient(180deg, #100D00 0%, #0A0A0A 100%);
      position: relative;
      overflow: hidden;
    }
    /* Línea dorada decorativa abajo */
    .page-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
    }

    .page-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 2.5rem;
    }

    .page-label {
      font-size: 0.7rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.6;
      margin-bottom: 0.5rem;
    }
    .page-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      animation: fadeup 0.7s ease both;
    }
    .page-subtitle {
      font-family: 'Crimson Pro', serif;
      font-style: italic;
      font-size: 1rem;
      color: rgba(245,238,216,0.45);
      margin-bottom: 2rem;
      animation: fadeup 0.7s 0.15s ease both;
    }
    @keyframes fadeup {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── FILTROS ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      animation: fadeup 0.7s 0.25s ease both;
    }
    .filter-btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.45rem 1.2rem;
      border: 1px solid rgba(201,168,76,0.25);
      background: transparent;
      color: rgba(245,238,216,0.45);
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
    }
    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.08);
    }

    /* ── MAIN CONTENT ── */
    main {
      padding: 3rem 1.5rem 5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── GRILLA DE PRODUCTOS ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: linear-gradient(160deg, #161005, #0c0900);
      border: 1px solid rgba(201,168,76,0.18);
      overflow: hidden;
      position: relative;
      transition: all 0.35s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      border-color: rgba(201,168,76,0.6);
      transform: translateY(-5px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 25px rgba(201,168,76,0.1);
    }



    .product-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #0a0800;
      position: relative;
    }
    .product-img-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      transition: transform 0.5s ease;
      display: block;
    }
    .product-card:hover .product-img-wrap img { transform: scale(1.06); }
    .product-img-wrap .img-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      color: rgba(201,168,76,0.2);
    }
    .product-img-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 40%;
      background: linear-gradient(transparent, rgba(10,8,0,0.7));
      pointer-events: none;
    }

    .product-info {
      padding: 1rem 1.1rem 1.2rem;
      flex: 1; display: flex; flex-direction: column; gap: 0.3rem;
    }
    .product-catalog {
      font-size: 0.7rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold); opacity: 0.6;
    }
    .product-name {
      font-weight: 700; font-size: 1rem;
      color: var(--cream); line-height: 1.3;
    }
    .product-price {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem; color: var(--gold);
      margin-top: auto; padding-top: 0.6rem;
    }

    /* Botón de consultar en WhatsApp dentro de la tarjeta */
    .product-wa {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      margin: 0 1.1rem 1rem;
      padding: 0.55rem 1rem;
      background: rgba(37,211,102,0.08);
      border: 1px solid rgba(37,211,102,0.3);
      color: #4ade80;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600; font-size: 0.75rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      text-decoration: none;
      transition: all 0.25s;
      opacity: 0;
      transform: translateY(4px);
    }
    .product-card:hover .product-wa {
      opacity: 1; transform: translateY(0);
    }
    .product-wa:hover {
      background: rgba(37,211,102,0.15);
      border-color: rgba(37,211,102,0.6);
    }
    .product-wa svg { width: 14px; height: 14px; flex-shrink: 0; }


    /* ── MENSAJE "SELECCIONÁ UNA CATEGORÍA" ── */
    .select-prompt {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      gap: 1.2rem;
    }
    .select-prompt-text {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1rem, 3vw, 1.4rem);
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.05em;
      animation: float-msg 3s ease-in-out infinite;
    }
    .select-prompt-arrow {
      font-size: 1.5rem;
      animation: float-msg 3s ease-in-out infinite reverse;
      filter: drop-shadow(0 0 8px rgba(201,168,76,0.4));
    }
    @keyframes float-msg {
      0%, 100% { transform: translateY(0px); opacity: 0.7; }
      50%       { transform: translateY(-8px); opacity: 1; }
    }

    /* ── ESTADOS ── */
    .loading-state, .error-state, .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 5rem 1rem;
      color: rgba(245,238,216,0.3);
      font-size: 1rem; letter-spacing: 0.1em;
    }
    .loading-dots { display: inline-flex; gap: 6px; margin-top: 1rem; }
    .loading-dots span {
      width: 8px; height: 8px;
      background: var(--gold-dark); border-radius: 50%;
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-8px); opacity: 1; }
    }

    /* Contador de resultados */
    .results-count {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245,238,216,0.3);
      margin-bottom: 1.5rem;
    }

    /* ── FOOTER ── */
    footer {
      background: #050400;
      border-top: 1px solid rgba(201,168,76,0.15);
      padding: 2.5rem 1.5rem; text-align: center;
    }
    footer .footer-logo { font-family: 'Cinzel Decorative', serif; font-size: 1.1rem; color: var(--gold); opacity: 0.7; margin-bottom: 0.5rem; }
    footer p { font-size: 0.8rem; color: rgba(245,238,216,0.25); letter-spacing: 0.1em; }

    /* ── SCROLL TO TOP ── */
    .scroll-top {
      position: fixed; bottom: 6.5rem; right: 1.5rem;
      z-index: 1000;
      width: 44px; height: 44px;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s, background 0.2s;
    }
    .scroll-top.visible {
      opacity: 1; pointer-events: all;
      transform: translateY(0);
    }
    .scroll-top:hover {
      background: rgba(201,168,76,0.22);
      border-color: var(--gold);
    }
    .scroll-top svg { width: 18px; height: 18px; }

    /* ── WHATSAPP FLOAT ── */
    .wa-float {
      position: fixed; bottom: 2rem; right: 1.5rem;
      z-index: 1000;
      display: flex; align-items: center; gap: 0.6rem;
      background: #25D366; color: white;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 0.9rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      text-decoration: none; padding: 0.85rem 1.4rem;
      border-radius: 50px;
      box-shadow: 0 6px 30px rgba(37,211,102,0.4);
      animation: wa-bounce 3s ease-in-out infinite;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .wa-float:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 10px 40px rgba(37,211,102,0.6); animation: none; }
    .wa-float svg { width: 22px; height: 22px; flex-shrink: 0; }
    @keyframes wa-bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* ── BARRA DE BÚSQUEDA ── */
    .search-wrap {
      max-width: 480px;
      margin: 1.5rem auto 0;
      position: relative;
      animation: fadeup 0.7s 0.3s ease both;
    }
    .search-input {
      width: 100%;
      background: rgba(201,168,76,0.05);
      border: 1px solid rgba(201,168,76,0.25);
      color: var(--cream);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      padding: 0.65rem 1rem 0.65rem 2.8rem;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }
    .search-input::placeholder { color: rgba(245,238,216,0.25); }
    .search-input:focus {
      border-color: var(--gold);
      background: rgba(201,168,76,0.08);
    }
    .search-icon {
      position: absolute;
      left: 0.85rem; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: rgba(201,168,76,0.45);
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 0.75rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(245,238,216,0.3);
      cursor: pointer; font-size: 1rem;
      display: none; line-height: 1;
      padding: 0;
    }
    .search-clear.visible { display: block; }
    .search-clear:hover { color: var(--gold); }

    @media (max-width: 600px) {
      .products-grid { grid-template-columns: 1fr 1fr; }
      nav { padding: 1rem; }
    }
    @media (max-width: 400px) {
      .products-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Kolvi 🐸</a>

<!-- HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <p class="page-label" id="pageLabel">Stock actualizado</p>
    <h1 class="page-title" id="pageTitle">Inventario</h1>
    <p class="page-subtitle" id="pageSubtitle">Cargando catálogo...</p>

    <!-- Filtros / catálogos — se generan dinámicamente desde el Sheet -->
    <div class="filter-bar" id="filterBar">

</main>

<footer>
  <p class="footer-logo">Kolvi Game Store</p>
  <p>&copy; 2025 kolvigamestore.com &mdash; Todos los derechos reservados</p>
</footer>

<!-- SCROLL TO TOP -->
<button class="scroll-top" id="scrollTop" aria-label="Volver arriba">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

  href="https://wa.me/50685842985?text=Hola%20Kolvi!%20Vi%20tu%20p%C3%A1gina%20%F0%9F%90%B8"
  target="_blank" rel="noopener" class="wa-float" aria-label="Contactar por WhatsApp"
>
  <svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>

<script>
  /* ═══════════════════════════════════════════════════════
     CONFIGURACIÓN — Una sola hoja: solo productos disponibles
  ══════════════════════════════════════════════════════ */
  const SHEET_PRODUCTOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTsSGxthS53I8A8Jq5lUKOMlLsfPVHOwEITsF1kFXfdFexMpTaYan1ESSx3FvwGm-nRyd1fzlJpKHtB/pub?gid=0&single=true&output=csv';

  /* ── Leer parámetro de la URL ── */
  const params   = new URLSearchParams(window.location.search);
  const catParam = (params.get('cat') || 'todo').toLowerCase();

  /* ── Helper: slug consistente ── */
  const toSlug = str =>
    str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '-');

  /* ── Columnas públicas que nos interesan (normalizadas) ── */
  const COLS_PUBLICAS = ['imagen', 'catalogo', 'nombre', 'precio'];

  /* ── Normalizar texto para comparar encabezados ── */
  const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  /* ── Parse CSV robusto ── */
  function parseCSV(texto) {
    const tokens = [];
    let celda = '', enComillas = false;

    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (c === '"') {
        if (enComillas && texto[i + 1] === '"') { celda += '"'; i++; }
        else { enComillas = !enComillas; }
      } else if (c === ',' && !enComillas) {
        tokens.push(celda); celda = '';
      } else if ((c === '\n' || (c === '\r' && texto[i + 1] === '\n')) && !enComillas) {
        if (c === '\r') i++;
        tokens.push(celda); tokens.push('\n'); celda = '';
      } else {
        celda += c;
      }
    }
    tokens.push(celda);

    const filas = [];
    let fila = [];
    for (const t of tokens) {
      if (t === '\n') { filas.push(fila); fila = []; }
      else            { fila.push(t.trim()); }
    }
    if (fila.length) filas.push(fila);
    if (filas.length < 2) return [];

    const headers = filas[0].map(norm);
    const idx = {};
    COLS_PUBLICAS.forEach(col => {
      const i = headers.indexOf(col);
      if (i !== -1) idx[col] = i;
    });

    return filas.slice(1)
      .map(cols => {
        const obj = {};
        COLS_PUBLICAS.forEach(col => {
          obj[col] = idx[col] !== undefined ? (cols[idx[col]] || '') : '';
        });
        return obj;
      })
      .filter(p => p.nombre);
  }

  /* ── Construir filtros desde los catálogos únicos de los productos ── */
  function buildFilters(productos) {
    const bar = document.getElementById('filterBar');

    const catalogosUnicos = [...new Set(
      productos.map(p => p.catalogo).filter(Boolean)
    )];

    catalogosUnicos.forEach(cat => {
      const slug = toSlug(cat);
      const btn  = document.createElement('button');
      btn.className     = 'filter-btn';
      btn.dataset.cat   = slug;
      btn.dataset.label = cat;
      btn.textContent   = cat;
      bar.appendChild(btn);
    });

    let tituloActivo    = 'Inventario';
    let subtituloActivo = 'Todo el stock disponible.';

    bar.querySelectorAll('.filter-btn').forEach(btn => {
      if (btn.dataset.cat === catParam) {
        btn.classList.add('active');
        tituloActivo    = btn.dataset.label || btn.textContent;
        subtituloActivo = `Stock disponible en ${tituloActivo}.`;
      }
    });

    document.title = `${tituloActivo} — Kolvi Game Store`;
    document.getElementById('pageTitle').textContent    = tituloActivo;
    document.getElementById('pageSubtitle').textContent = subtituloActivo;

    /* ── Clicks en filtros ── */
    bar.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;

      bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (slug !== 'todo') btn.classList.add('active');

      const slug  = btn.dataset.cat;
      const label = btn.dataset.label || btn.textContent;

      document.getElementById('pageTitle').textContent    = slug === 'todo' ? 'Inventario' : label;
      document.getElementById('pageSubtitle').textContent = slug === 'todo' ? 'Todo el stock disponible.' : `Stock disponible en ${label}.`;

      /* Limpiar búsqueda al cambiar filtro */
      document.getElementById('searchInput').value = '';
      document.getElementById('searchClear').classList.remove('visible');

      aplicarFiltro(slug);
    });

    /* ── Búsqueda en tiempo real ── */
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim();
      searchClear.classList.toggle('visible', query.length > 0);

      if (query.length === 0) {
        const activeBtn = bar.querySelector('.filter-btn.active');
        const slug = activeBtn ? activeBtn.dataset.cat : 'todo';
        aplicarFiltro(slug);
        return;
      }

      /* Busca en TODO el catálogo, ignorando el filtro activo */
      const palabras = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/\s+/);
      const resultados = window._productos.filter(p => {
        const haystack = (p.nombre + ' ' + p.catalogo).toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        return palabras.every(pal => haystack.includes(pal));
      });

      document.getElementById('pageTitle').textContent    = 'Búsqueda';
      document.getElementById('pageSubtitle').textContent = `Resultados para "${query}"`;
      renderProductos(resultados);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.classList.remove('visible');
      const activeBtn = bar.querySelector('.filter-btn.active');
      const slug = activeBtn ? activeBtn.dataset.cat : 'todo';
      const label = activeBtn ? (activeBtn.dataset.label || activeBtn.textContent) : 'Inventario';
      document.getElementById('pageTitle').textContent    = slug === 'todo' ? 'Inventario' : label;
      document.getElementById('pageSubtitle').textContent = slug === 'todo' ? 'Seleccioná una categoría.' : `Stock disponible en ${label}.`;
      aplicarFiltro(slug);
    });
  } /* ── fin buildFilters ── */

  /* ── Filtrar y renderizar ── */
  function aplicarFiltro(slug) {
    if (slug === 'todo') {
      renderProductos(window._productos);
      return;
    }
    const filtrados = window._productos.filter(p => p.catalogo && toSlug(p.catalogo) === slug);
    renderProductos(filtrados);
  }

  /* ── Render tarjetas ── */
  function renderProductos(productos) {
    const grid  = document.getElementById('productsGrid');
    const count = document.getElementById('resultsCount');

    if (!productos.length) {
      grid.innerHTML    = '<div class="empty-state">No hay productos en esta categoría por el momento.</div>';
      count.textContent = '';
      return;
    }

    count.textContent = `${productos.length} producto${productos.length !== 1 ? 's' : ''} disponible${productos.length !== 1 ? 's' : ''}`;

    grid.innerHTML = productos.map(p => {
      const imgHTML         = p.imagen
        ? `<img src="${p.imagen}" alt="${p.nombre}" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const placeholderHTML = `<div class="img-placeholder" style="display:${p.imagen ? 'none' : 'flex'}">🎮</div>`;

      const waMsg  = encodeURIComponent(`Hola Kolvi! 🐸 Me interesa el producto: ${p.nombre}. ¿Está disponible?`);
      const waLink = `https://wa.me/50685842985?text=${waMsg}`;

      return `
        <div class="product-card">
          <div class="product-img-wrap">
            ${imgHTML}
            ${placeholderHTML}
          </div>
          <div class="product-info">
            <p class="product-catalog">${p.catalogo || ''}</p>
            <p class="product-name">${p.nombre}</p>
            <p class="product-price">${p.precio || ''}</p>
          </div>
          <a href="${waLink}" target="_blank" rel="noopener" class="product-wa">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
              <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.528 5.855L0 24l6.335-1.652A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.9 0-3.681-.52-5.21-1.426l-.374-.222-3.884 1.013 1.036-3.782-.245-.39A9.961 9.961 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
            </svg>
            Consultar
          </a>
        </div>`;
    }).join('');

    /* Animación escalonada */
    grid.querySelectorAll('.product-card').forEach((card, i) => {
      card.style.opacity    = '0';
      card.style.transform  = 'translateY(20px)';
      card.style.transition = `opacity 0.4s ease ${i * 0.04}s, transform 0.4s ease ${i * 0.04}s`;
      setTimeout(() => {
        card.style.opacity   = '1';
        card.style.transform = 'translateY(0)';
      }, 50);
    });
  }

  /* ══════════════════════════════════════════════════════
     INICIO: Una sola carga
  ══════════════════════════════════════════════════════ */
  async function init() {
    document.getElementById('productsGrid').innerHTML =
      `<div class="loading-state">Cargando productos<div class="loading-dots"><span></span><span></span><span></span></div></div>`;

    try {
      const res   = await fetch(SHEET_PRODUCTOS);
      const texto = await res.text();
      const todos = parseCSV(texto);

      window._productos = todos;

      /* Construir filtros desde los catálogos reales */
      buildFilters(todos);

      /* Renderizar según la URL */
      aplicarFiltro(catParam);

    } catch (err) {
      document.getElementById('productsGrid').innerHTML =
        `<div class="error-state">⚠️ No se pudo cargar el inventario.<br>Revisá tu conexión o escribinos por WhatsApp.</div>`;
      console.error(err);
    }
  }

  init();

  /* ── Scroll to top ── */
  const scrollTopBtn = document.getElementById('scrollTop');
  window.addEventListener('scroll', () => {
    scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
  });
  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

</body>
</html>
